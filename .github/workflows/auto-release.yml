name: Auto release

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      release-sha:
        description: Commit SHA to evaluate and release.
        required: false
        type: string
        default: ""
      pr-number:
        description: Pull request number to comment on.
        required: false
        type: string
        default: ""
      svelte-lib-ref:
        description: svelte-lib ref used to run the shared release workflow.
        required: false
        type: string
        default: e7b482b3627dd2cd9272fa12f851e2109eb826a8

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  auto-release-after-pr:
    if: github.event.pull_request.merged == true
    uses: cyaris/svelte-lib/.github/workflows/auto-release.yml@e7b482b3627dd2cd9272fa12f851e2109eb826a8
    with:
      pr-number: ${{ github.event.pull_request.number }}
      release-sha: ${{ github.event.pull_request.merge_commit_sha }}
      svelte-lib-ref: ${{ vars.SVELTE_LIB_REF || 'e7b482b3627dd2cd9272fa12f851e2109eb826a8' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}

  auto-release-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: cyaris/svelte-lib/.github/workflows/auto-release.yml@e7b482b3627dd2cd9272fa12f851e2109eb826a8
    with:
      pr-number: ${{ inputs.pr-number }}
      release-sha: ${{ inputs.release-sha || github.sha }}
      svelte-lib-ref: ${{ inputs.svelte-lib-ref || vars.SVELTE_LIB_REF || 'e7b482b3627dd2cd9272fa12f851e2109eb826a8' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
