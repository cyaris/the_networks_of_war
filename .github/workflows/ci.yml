name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      svelte-lib-ref:
        description: svelte-lib ref used for the local file dependency.
        required: false
        type: string
        default: main

jobs:
  node-package-ci:
    uses: cyaris/shared-automation/.github/workflows/ci.yml@main
    with:
      working-directory: frontend
      svelte-lib-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.svelte-lib-ref || vars.SVELTE_LIB_REF || 'main' }}
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
