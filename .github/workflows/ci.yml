name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      svelte-lib-ref:
        description: svelte-lib ref used for the local file dependency.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  node-package-ci:
    uses: cyaris/shared-automation/.github/workflows/ci.yml@d8b402e487b26a803abadc3afdf0d6c3cac77820
    with:
      working-directory: frontend
      local-dependency-repositories: |
        cyaris/svelte-lib:svelte-lib:${{ inputs.svelte-lib-ref || vars.SVELTE_LIB_REF || github.head_ref == 'dev' && 'dev' || github.ref_name == 'dev' && 'dev' || 'main' }}
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
