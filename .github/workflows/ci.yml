name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      svelte-lib-ref:
        description: svelte-lib ref used for the local file dependency.
        required: false
        type: string
        default: e7b482b3627dd2cd9272fa12f851e2109eb826a8

jobs:
  node-package-ci:
    uses: cyaris/svelte-lib/.github/workflows/node-package-ci.yml@e7b482b3627dd2cd9272fa12f851e2109eb826a8
    with:
      working-directory: frontend
      svelte-lib-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.svelte-lib-ref || vars.SVELTE_LIB_REF || 'e7b482b3627dd2cd9272fa12f851e2109eb826a8' }}
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
